config:
  target: "https://ais-dev-ysij5gfggpt2akxlk7vm3b-58584043488.asia-east1.run.app"
  phases:
    # Phase 1: Warm up (Gentle ramp to establish connection pools)
    - duration: 30
      arrivalRate: 5
      name: "Phase 1: Warm up & Connection Pooling"
    # Phase 2: Sustained Load (Real-world concurrent traffic simulation)
    - duration: 60
      arrivalRate: 20
      rampTo: 50
      name: "Phase 2: Sustained Multi-User Load"
    # Phase 3: Stress Spike (Scale test within Firebase Spark plan safe boundaries)
    - duration: 30
      arrivalRate: 100
      name: "Phase 3: Peak Stress & Scale Test"
  defaults:
    headers:
      User-Agent: "Artillery-VibeSync-LoadTester/2.0"
      Accept: "text/html,application/json"
  ensure:
    # Service Level Objectives (SLOs)
    p95: 250
    p99: 500
    maxErrorRate: 1

scenarios:
  - name: "User Session Flow (App Launch, Clean Screen Render & Health Check)"
    flow:
      - get:
          url: "/"
          expect:
            - statusCode: 200
      - think: 2
      - get:
          url: "/metadata.json"
          expect:
            - statusCode: 200
      - think: 1
